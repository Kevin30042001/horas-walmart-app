name: Generar keystore de firma (una sola vez)

# Este workflow se dispara A MANO desde la pestana "Actions" de GitHub
# (no corre automaticamente). Genera un keystore de firma para el APK usando
# el JDK que ya trae el runner de GitHub -- no hace falta Java ni
# Android Studio en tu computadora.
#
# PASOS DESPUES DE CORRERLO:
#   1. Entra a la ejecucion del workflow y descarga el artifact "keystore".
#   2. Abre el archivo info.txt que viene adentro (tiene las contrasenas).
#   3. Ve a Settings > Secrets and variables > Actions > New repository secret
#      y crea estos 4 secrets:
#        MIS_HORAS_KEYSTORE_BASE64   (contenido del archivo release.keystore.base64)
#        MIS_HORAS_KEYSTORE_PASSWORD
#        MIS_HORAS_KEY_ALIAS
#        MIS_HORAS_KEY_PASSWORD
#   4. IMPORTANTE: borra el artifact de esta ejecucion (o el repo debe ser
#      privado) una vez que copiaste los secrets -- el keystore no debe quedar
#      descargable por nadie mas.
#   5. Corre este workflow UNA SOLA VEZ. Si lo vuelves a correr, generaras un
#      keystore distinto y Android ya no dejara instalar actualizaciones sobre
#      el APK anterior (tendrias que desinstalar la app vieja primero).

on:
  workflow_dispatch: {}

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Generar keystore con keytool (JDK incluido en el runner)
        run: |
          ALIAS="mishoras"
          STORE_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 24)

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=Mis Horas, OU=Personal, O=Personal, L=San Salvador, S=San Salvador, C=SV"

          base64 -w0 release.keystore > release.keystore.base64

          {
            echo "Guarda estos valores como GitHub Secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "MIS_HORAS_KEYSTORE_BASE64   -> contenido de release.keystore.base64 (pegalo completo)"
            echo "MIS_HORAS_KEYSTORE_PASSWORD -> $STORE_PASS"
            echo "MIS_HORAS_KEY_ALIAS         -> $ALIAS"
            echo "MIS_HORAS_KEY_PASSWORD      -> $KEY_PASS"
            echo ""
            echo "Despues de copiarlos, borra este artifact. No vuelvas a correr este workflow"
            echo "(generaria una firma distinta e invalidaria las actualizaciones del APK)."
          } > info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.keystore.base64
            info.txt
          retention-days: 1
